<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voice-First AI Visual</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0E0F13;
      font-family: Inter, system-ui, sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
    }

    .ui-shell {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      color: white;
    }

    .glass-header {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      height: 56px;
      border-radius: 14px;
      background: rgba(14,15,19,.15);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      pointer-events: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #777;
    }

    .status-dot.listening {
      background: #2DD4A8;
      box-shadow: 0 0 18px rgba(45,212,168,.8);
      animation: pulseDot 1.4s infinite;
    }

    .header-icons {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      color: white;
      display: grid;
      place-items: center;
    }

    .activity-panel {
      position: fixed;
      top: 86px;
      right: 14px;
      width: 260px;
      border-radius: 14px;
      background: rgba(14,15,19,.15);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.06);
      padding: 16px;
      pointer-events: auto;
    }

    .activity-panel h3 {
      margin: 0 0 10px;
      font-size: 10px;
      letter-spacing: .12em;
      color: rgba(255,255,255,.55);
    }

    .activity-item {
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
      font-size: 13px;
      color: rgba(255,255,255,.8);
    }

    .response-card {
      position: fixed;
      left: 7vw;
      top: 30vh;
      width: 260px;
      border-radius: 16px;
      background: rgba(22,23,29,.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.06);
      border-top: 2px solid #2DD4A8;
      padding: 16px;
      font-size: 13px;
      line-height: 1.4;
      animation: floatCard 4s ease-in-out infinite;
    }

    .mic-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 28px;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .mic-button {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #16171D;
      border: 1px solid rgba(255,255,255,.08);
      color: white;
      display: grid;
      place-items: center;
      pointer-events: auto;
      cursor: pointer;
      font-size: 24px;
    }

    .mic-button.listening {
      border-color: #2DD4A8;
      box-shadow: 0 0 24px rgba(45,212,168,.5);
    }

    .mic-button.listening::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid rgba(45,212,168,.8);
      animation: micPulse 1.4s infinite cubic-bezier(.16,1,.3,1);
    }

    .mic-hint {
      margin-top: 10px;
      font-size: 11px;
      letter-spacing: .08em;
      color: rgba(255,255,255,.4);
    }

    .tooltip {
      position: fixed;
      z-index: 5;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(14,15,19,.85);
      border: 1px solid rgba(255,255,255,.1);
      color: white;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px);
      transition: .15s ease;
    }

    .tooltip.show {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes pulseDot {
      50% { transform: scale(1.4); }
    }

    @keyframes micPulse {
      from { transform: scale(.8); opacity: 1; }
      to { transform: scale(1.5); opacity: 0; }
    }

    @keyframes floatCard {
      50% { transform: translateY(-6px) rotateX(8deg); }
    }

    @media (max-width: 800px) {
      .activity-panel { display: none; }
      .response-card { display: none; }
    }
  </style>
</head>

<body>
  <div class="ui-shell">
    <header class="glass-header">
      <div class="brand">
        <span>TRILLION</span>
        <span id="statusDot" class="status-dot"></span>
      </div>

      <div class="header-icons">
        <button class="icon-btn">🧠</button>
        <button class="icon-btn">🔔</button>
        <button class="icon-btn">⚙️</button>
      </div>
    </header>

    <aside class="activity-panel">
      <h3>INBOX REPLIES</h3>
      <div class="activity-item">Revenue summary ready</div>

      <h3>SCOUT TASKS</h3>
      <div class="activity-item">Scanning opportunities</div>

      <h3>FLUX TASKS</h3>
      <div class="activity-item">Knowledge graph synced</div>

      <h3>RELAY DRAFTS</h3>
      <div class="activity-item">Two drafts waiting</div>
    </aside>

    <div class="response-card">
      Neural pathway active. Trillion is mapping connected sources, tasks, drafts, and replies.
    </div>

    <div class="mic-bar">
      <button id="micButton" class="mic-button" aria-label="Toggle microphone">
        <span id="micIcon">🎙️</span>
      </button>
      <div class="mic-hint">TAP OR SAY "HEY TRILLION"</div>
    </div>
  </div>

  <div id="tooltip" class="tooltip"></div>

  <script type="module">
    import * as THREE from "https://esm.sh/three@0.174.0";
    import { OrbitControls } from "https://esm.sh/three@0.174.0/examples/jsm/controls/OrbitControls.js";
    import { EffectComposer } from "https://esm.sh/three@0.174.0/examples/jsm/postprocessing/EffectComposer.js";
    import { RenderPass } from "https://esm.sh/three@0.174.0/examples/jsm/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "https://esm.sh/three@0.174.0/examples/jsm/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "https://esm.sh/three@0.174.0/examples/jsm/postprocessing/OutputPass.js";
    import { CSS2DRenderer, CSS2DObject } from "https://esm.sh/three@0.174.0/examples/jsm/renderers/CSS2DRenderer.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#0E0F13");

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(innerWidth, innerHeight);
    labelRenderer.domElement.style.position = "fixed";
    labelRenderer.domElement.style.inset = "0";
    labelRenderer.domElement.style.zIndex = "2";
    labelRenderer.domElement.style.pointerEvents = "none";
    document.body.appendChild(labelRenderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.8, 0.7, 0.05));
    composer.addPass(new OutputPass());

    const clock = new THREE.Clock();
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const tooltip = document.getElementById("tooltip");

    let uVoiceBright = { value: 0 };

    window.setVoiceBright = v => {
      uVoiceBright.value = THREE.MathUtils.clamp(v, 0, 1);
    };

    scene.add(new THREE.AmbientLight(0x7dd3fc, 0.35));

    const data = {
      nodes: [
        { id: "trillion", type: "hub", label: "TRILLION", color: "#2DD4A8", freshness: 1, detail: "Voice-first AI core" },

        { id: "inbox", type: "category", label: "Inbox", color: "#60A5FA", freshness: .8, detail: "Email and replies" },
        { id: "tasks", type: "category", label: "Tasks", color: "#A78BFA", freshness: .7, detail: "Scout and Flux tasks" },
        { id: "drafts", type: "category", label: "Drafts", color: "#F472B6", freshness: .65, detail: "Relay drafts" },
        { id: "memory", type: "category", label: "Memory", color: "#34D399", freshness: .9, detail: "Knowledge sources" },

        { id: "revenue", type: "leaf", label: "Revenue", color: "#60A5FA", freshness: .9, detail: "Revenue summary ready" },
        { id: "client", type: "leaf", label: "Client Reply", color: "#60A5FA", freshness: .7, detail: "Suggested reply waiting" },
        { id: "scout", type: "leaf", label: "Scout", color: "#A78BFA", freshness: .75, detail: "Scanning opportunities" },
        { id: "flux", type: "leaf", label: "Flux", color: "#A78BFA", freshness: .6, detail: "Model activity normal" },
        { id: "relay", type: "leaf", label: "Relay", color: "#F472B6", freshness: .8, detail: "Two drafts waiting" },
        { id: "notes", type: "leaf", label: "Notes", color: "#34D399", freshness: .7, detail: "Context indexed" },
        { id: "files", type: "leaf", label: "Files", color: "#34D399", freshness: .55, detail: "Source documents connected" }
      ],
      edges: [
        ["trillion","inbox"], ["trillion","tasks"], ["trillion","drafts"], ["trillion","memory"],
        ["inbox","revenue"], ["inbox","client"],
        ["tasks","scout"], ["tasks","flux"],
        ["drafts","relay"],
        ["memory","notes"], ["memory","files"]
      ]
    };

    const nodeMap = new Map();
    const nodeMeshes = [];
    const edgeLines = [];

    const hub = data.nodes.find(n => n.type === "hub");
    hub.position = new THREE.Vector3(0, 0, 0);

    const categories = data.nodes.filter(n => n.type === "category");
    categories.forEach((node, i) => {
      const a = i / categories.length * Math.PI * 2;
      node.position = new THREE.Vector3(Math.cos(a) * 4.2, Math.sin(a) * 1.2, Math.sin(a) * 4.2);
    });

    const leaves = data.nodes.filter(n => n.type === "leaf");
    leaves.forEach((node, i) => {
      const parentEdge = data.edges.find(e => e[1] === node.id);
      const parent = data.nodes.find(n => n.id === parentEdge[0]);
      const a = i * 1.7;
      node.position = parent.position.clone().add(new THREE.Vector3(
        Math.cos(a) * 2.2,
        Math.sin(i) * 1.4,
        Math.sin(a) * 2.2
      ));
      node.basePosition = node.position.clone();
    });

    data.nodes.forEach(node => {
      const size = node.type === "hub" ? 0.62 : node.type === "category" ? 0.34 : 0.2;
      const color = new THREE.Color(node.color);

      const material = new THREE.ShaderMaterial({
        transparent: true,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uColor: { value: color },
          uFresh: { value: node.freshness },
          uVoiceBright
        },
        vertexShader: `
          varying vec3 vNormal;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform float uFresh;
          uniform float uVoiceBright;
          uniform vec3 uColor;
          varying vec3 vNormal;

          void main() {
            float pulse = 0.75 + 0.25 * sin(uTime * 1.6);
            float rim = pow(1.0 - abs(vNormal.z), 2.0);
            vec3 color = uColor * (1.2 + uFresh + uVoiceBright * 1.6);
            float alpha = 0.72 + rim * 0.28;
            gl_FragColor = vec4(color * pulse, alpha);
          }
        `
      });

      const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 48, 48), material);
      mesh.position.copy(node.position);
      mesh.userData = node;
      scene.add(mesh);

      const halo = new THREE.Mesh(
        new THREE.SphereGeometry(size * 1.9, 48, 48),
        new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: node.type === "hub" ? 0.22 : 0.12,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      halo.position.copy(node.position);
      scene.add(halo);

      const label = document.createElement("div");
      label.textContent = node.label;
      label.style.color = "rgba(255,255,255,.78)";
      label.style.fontSize = node.type === "hub" ? "13px" : "11px";
      label.style.letterSpacing = ".08em";
      label.style.textTransform = "uppercase";
      label.style.textShadow = "0 0 10px rgba(45,212,168,.6)";
      const labelObj = new CSS2DObject(label);
      labelObj.position.set(0, size + 0.25, 0);
      mesh.add(labelObj);

      node.mesh = mesh;
      node.halo = halo;
      nodeMap.set(node.id, node);
      nodeMeshes.push(mesh);
    });

    data.edges.forEach(([a, b]) => {
      const n1 = nodeMap.get(a);
      const n2 = nodeMap.get(b);

      const geometry = new THREE.BufferGeometry().setFromPoints([n1.mesh.position, n2.mesh.position]);
      const material = new THREE.LineBasicMaterial({
        color: n2.color,
        transparent: true,
        opacity: 0.35,
        blending: THREE.AdditiveBlending
      });

      const line = new THREE.Line(geometry, material);
      scene.add(line);
      edgeLines.push({ line, n1, n2 });
    });

    const starsGeo = new THREE.BufferGeometry();
    const starCount = 1400;
    const starPos = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount; i++) {
      starPos[i * 3] = (Math.random() - 0.5) * 50;
      starPos[i * 3 + 1] = (Math.random() - 0.5) * 30;
      starPos[i * 3 + 2] = (Math.random() - 0.5) * 50;
    }

    starsGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));

    const stars = new THREE.Points(
      starsGeo,
      new THREE.PointsMaterial({
        color: 0x8ee8ff,
        size: 0.035,
        transparent: true,
        opacity: 0.7,
        blending: THREE.AdditiveBlending
      })
    );

    scene.add(stars);

    const particlesGeo = new THREE.BufferGeometry();
    const particleCount = 500;
    const particlePos = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      particlePos[i * 3] = (Math.random() - 0.5) * 14;
      particlePos[i * 3 + 1] = (Math.random() - 0.5) * 8;
      particlePos[i * 3 + 2] = (Math.random() - 0.5) * 14;
    }

    particlesGeo.setAttribute("position", new THREE.BufferAttribute(particlePos, 3));

    const particles = new THREE.Points(
      particlesGeo,
      new THREE.PointsMaterial({
        color: 0x2dd4a8,
        size: 0.025,
        transparent: true,
        opacity: 0.5,
        blending: THREE.AdditiveBlending
      })
    );

    scene.add(particles);

    addEventListener("pointermove", e => {
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / innerHeight) * 2 + 1;

      tooltip.style.left = `${e.clientX + 14}px`;
      tooltip.style.top = `${e.clientY + 14}px`;
    });

    let listening = false;

    const micButton = document.getElementById("micButton");
    const micIcon = document.getElementById("micIcon");
    const statusDot = document.getElementById("statusDot");

    micButton.addEventListener("click", () => {
      listening = !listening;

      micButton.classList.toggle("listening", listening);
      statusDot.classList.toggle("listening", listening);
      micIcon.textContent = listening ? "■" : "🎙️";

      window.setVoiceBright(listening ? 1 : 0);

      window.dispatchEvent(new CustomEvent("trillion:mic-toggle", {
        detail: { listening }
      }));
    });

    function animate() {
      requestAnimationFrame(animate);

      const t = clock.getElapsedTime();

      data.nodes.forEach((node, i) => {
        if (node.mesh.material.uniforms.uTime) {
          node.mesh.material.uniforms.uTime.value = t;
        }

        if (node.type === "leaf") {
          node.mesh.position.copy(node.basePosition);
          node.mesh.position.y += Math.sin(t * 1.2 + i) * 0.18;
        }

        if (node.type === "category") {
          const angle = t * 0.25 + i * Math.PI * 0.5;
          node.mesh.position.x = Math.cos(angle) * 4.2;
          node.mesh.position.z = Math.sin(angle) * 4.2;
        }

        node.halo.position.copy(node.mesh.position);
        node.halo.scale.setScalar(1 + Math.sin(t * 1.5 + i) * 0.06);
      });

      edgeLines.forEach(({ line, n1, n2 }) => {
        const pos = line.geometry.attributes.position;
        pos.setXYZ(0, n1.mesh.position.x, n1.mesh.position.y, n1.mesh.position.z);
        pos.setXYZ(1, n2.mesh.position.x, n2.mesh.position.y, n2.mesh.position.z);
        pos.needsUpdate = true;
      });

      stars.rotation.y += 0.0004;
      particles.rotation.y -= 0.0008;
      particles.rotation.x += 0.0003;

      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(nodeMeshes);

      if (hits.length) {
        const node = hits[0].object.userData;
        tooltip.innerHTML = `<strong>${node.label}</strong><br>${node.detail}`;
        tooltip.classList.add("show");
      } else {
        tooltip.classList.remove("show");
      }

      controls.update();
      composer.render();
      labelRenderer.render(scene, camera);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      labelRenderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
